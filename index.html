<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>دفتري</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1F4; --surface: #FFFFFF; --ink: #1B2430; --muted: #6B7684;
    --line: #D5DBE2; --accent: #1F6F78; --accent-ink: #FFFFFF; --danger: #B3261E;
    --ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    --read: "Noto Naskh Arabic", "Traditional Arabic", serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12171D; --surface: #1A2129; --ink: #E6EAEE; --muted: #8C97A4;
      --line: #2A333D; --accent: #5FB3BC; --accent-ink: #0E1418; --danger: #F2837B; }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); }
  body { min-height: 100vh; }
  [hidden] { display: none !important; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); border-radius: 10px; padding: 10px 14px; min-height: 44px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.danger { color: var(--danger); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input { font: inherit; width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--surface); color: var(--ink); min-height: 44px; }

  /* Login */
  #login .wrap { max-width: 380px; padding-top: 18vh; }
  #login h1 { font-family: var(--read); font-size: 2.4rem; margin: 0 0 24px; }
  #login form { display: grid; gap: 12px; }
  .err { color: var(--danger); min-height: 1.4em; margin: 0; font-size: .95rem; }

  /* List */
  .top { display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px);
    background: var(--bg); padding: 12px 0; z-index: 2; }
  .top h1 { font-family: var(--read); font-size: 1.6rem; margin: 0; flex: 1; }
  .search { margin: 4px 0 16px; }
  .items { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .item { display: flex; gap: 10px; align-items: flex-start; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .item .open { flex: 1; text-align: right; background: none; border: 0; padding: 0; min-height: 0; }
  .item h2 { font-family: var(--read); font-size: 1.25rem; font-weight: 600; margin: 0 0 4px; }
  .item p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item small { color: var(--muted); font-size: .8rem; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; line-height: 1.8; }

  /* Editor */
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .status { color: var(--muted); font-size: .85rem; flex: 1; }
  #title { font-family: var(--read); font-size: 1.6rem; font-weight: 600; border: 0; background: none;
    padding: 12px 0; margin-top: 8px; }
  #body { width: 100%; min-height: 60vh; border: 0; background: none; color: var(--ink); resize: none;
    font-family: var(--read); font-size: 1.15rem; line-height: 2; padding: 0; overflow: hidden; }
  .meta { color: var(--muted); font-size: .8rem; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 12px; }

  .toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%;
    transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px;
    border-radius: 10px; font-size: .95rem; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<section id="login" hidden>
  <div class="wrap">
    <h1>دفتري</h1>
    <form id="loginForm">
      <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required>
      <input id="password" type="password" placeholder="كلمة السر" autocomplete="current-password" required>
      <button class="primary" type="submit">دخول</button>
      <p class="err" id="loginErr"></p>
    </form>
  </div>
</section>

<section id="list" hidden>
  <div class="wrap">
    <div class="top">
      <h1>دفتري</h1>
      <button class="primary" id="newBtn">مقالة جديدة</button>
      <button id="logoutBtn" aria-label="خروج">خروج</button>
    </div>
    <input class="search" id="search" type="search" placeholder="ابحث في العناوين والنصوص">
    <ul class="items" id="items"></ul>
    <p class="empty" id="empty" hidden></p>
  </div>
</section>

<section id="editor" hidden>
  <div class="wrap">
    <div class="top bar">
      <button id="backBtn">رجوع</button>
      <span class="status" id="status"></span>
      <button class="primary" id="copyBtn">نسخ النص</button>
      <button class="danger" id="deleteBtn">حذف</button>
    </div>
    <input id="title" placeholder="العنوان" autocomplete="off">
    <textarea id="body" placeholder="اكتب هنا…"></textarea>
    <div class="meta" id="meta"></div>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, collection, doc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== Paste your Firebase config here

const firebaseConfig = {
  apiKey: "AIzaSyAqELNUBB80_WhlOigiOIk-jOvz1DVJwYY",
  authDomain: "notes-e4da2.firebaseapp.com",
  projectId: "notes-e4da2",
  storageBucket: "notes-e4da2.firebasestorage.app",
  messagingSenderId: "857722848829",
  appId: "1:857722848829:web:4785facba5359154cdcc54"
};



 ===========================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { localCache: persistentLocalCache() });

const $ = (id) => document.getElementById(id);
const MAX_BYTES = 900_000; // Firestore doc limit is ~1 MiB
let articles = [], currentId = null, saveTimer = null, saving = null, dirty = false, unsub = null;

const show = (id) => ["login", "list", "editor"].forEach(s => $(s).hidden = s !== id);
const colRef = () => collection(db, "users", auth.currentUser.uid, "articles");

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800);
}
const fmtDate = (ts) => ts ? new Intl.DateTimeFormat("ar-EG", { dateStyle: "medium", timeStyle: "short" }).format(ts.toDate()) : "";
const normalize = (s) => (s || "").replace(/[\u064B-\u0652]/g, "").replace(/[أإآ]/g, "ا")
  .replace(/ة/g, "ه").replace(/ى/g, "ي").toLowerCase();
const words = (s) => (s.trim().match(/\S+/g) || []).length;

// ----- Auth -----
onAuthStateChanged(auth, (user) => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) { show("login"); return; }
  unsub = onSnapshot(query(colRef(), orderBy("updatedAt", "desc")), (snap) => {
    articles = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: "estimate" }) }));
    renderList();
  });
  show("list");
});

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault(); $("loginErr").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value); }
  catch (err) {
    const map = {
      "auth/invalid-credential": "البريد أو كلمة السر غير صحيحة.",
      "auth/too-many-requests": "محاولات كثيرة. انتظر قليلًا ثم حاول مجددًا.",
      "auth/network-request-failed": "تعذّر الاتصال. تحقّق من الإنترنت."
    };
    $("loginErr").textContent = map[err.code] || "تعذّر الدخول. حاول مجددًا.";
  }
});
$("logoutBtn").onclick = () => signOut(auth);

// ----- List -----
function renderList() {
  const q = normalize($("search").value);
  const list = q ? articles.filter(a => normalize(a.title + " " + a.body).includes(q)) : articles;
  $("items").innerHTML = "";
  $("empty").hidden = list.length > 0;
  $("empty").textContent = articles.length ? "لا توجد نتائج لهذا البحث." : "لا توجد مقالات بعد. اضغط «مقالة جديدة» لتبدأ.";
  for (const a of list) {
    const li = document.createElement("li"); li.className = "item";
    const open = document.createElement("button"); open.className = "open";
    const h = document.createElement("h2"); h.textContent = a.title || "بدون عنوان";
    const p = document.createElement("p"); p.textContent = (a.body || "").slice(0, 200);
    const s = document.createElement("small"); s.textContent = fmtDate(a.updatedAt) + " — " + words(a.body || "") + " كلمة";
    open.append(h, p, s); open.onclick = () => openEditor(a);
    const copy = document.createElement("button"); copy.textContent = "نسخ";
    copy.onclick = () => copyText(a.body || "");
    li.append(open, copy); $("items").append(li);
  }
}
$("search").addEventListener("input", renderList);

// ----- Editor -----
function openEditor(a) {
  currentId = a ? a.id : null;
  $("title").value = a ? a.title || "" : "";
  $("body").value = a ? a.body || "" : "";
  const backup = localStorage.getItem("draft:" + (currentId || "new"));
  if (!a && backup) { try { const d = JSON.parse(backup); $("title").value = d.title; $("body").value = d.body; } catch {} }
  $("deleteBtn").hidden = !currentId;
  $("status").textContent = a ? "محفوظة" : "";
  dirty = false; updateMeta(); show("editor"); grow();
  if (!a) $("body").focus();
}
$("newBtn").onclick = () => openEditor(null);

function grow() { const b = $("body"); b.style.height = "auto"; b.style.height = b.scrollHeight + "px"; }
function updateMeta() {
  const bytes = new Blob([$("title").value + $("body").value]).size;
  const warn = bytes > MAX_BYTES * 0.9 ? " — اقتربت من الحد الأقصى لحجم المقالة، ابدأ مقالة جديدة." : "";
  $("meta").textContent = words($("body").value) + " كلمة" + warn;
  return bytes;
}

function onEdit() {
  dirty = true; grow();
  localStorage.setItem("draft:" + (currentId || "new"), JSON.stringify({ title: $("title").value, body: $("body").value }));
  $("status").textContent = "جارٍ الحفظ…";
  clearTimeout(saveTimer); saveTimer = setTimeout(save, 1200);
  updateMeta();
}
$("title").addEventListener("input", onEdit);
$("body").addEventListener("input", onEdit);

async function save() {
  clearTimeout(saveTimer);
  if (saving) await saving;
  if (!dirty) return;
  const title = $("title").value.trim(), body = $("body").value;
  if (!title && !body.trim()) { $("status").textContent = ""; dirty = false; return; }
  if (updateMeta() > MAX_BYTES) { $("status").textContent = "المقالة أكبر من الحد المسموح، لم تُحفظ."; return; }
  dirty = false;
  saving = (async () => {
    try {
      if (currentId) await updateDoc(doc(colRef(), currentId), { title, body, updatedAt: serverTimestamp() });
      else {
        const ref = await addDoc(colRef(), { title, body, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
        localStorage.removeItem("draft:new"); currentId = ref.id; $("deleteBtn").hidden = false;
      }
      localStorage.removeItem("draft:" + currentId);
      $("status").textContent = navigator.onLine ? "محفوظة" : "محفوظة على الجهاز، وستُرفع عند عودة الإنترنت";
    } catch { dirty = true; $("status").textContent = "تعذّر الحفظ. ستُعاد المحاولة عند التعديل التالي."; }
  })();
  await saving; saving = null;
}

$("backBtn").onclick = async () => { await save(); show("list"); };
$("copyBtn").onclick = () => copyText($("body").value);
$("deleteBtn").onclick = async () => {
  if (!currentId || !confirm("حذف هذه المقالة نهائيًا؟")) return;
  clearTimeout(saveTimer); dirty = false;
  await deleteDoc(doc(colRef(), currentId));
  localStorage.removeItem("draft:" + currentId); currentId = null;
  show("list"); toast("حُذفت المقالة");
};

async function copyText(text) {
  if (!text) { toast("لا يوجد نص للنسخ"); return; }
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement("textarea"); t.value = text; document.body.append(t);
    t.select(); document.execCommand("copy"); t.remove();
  }
  toast("نُسخ النص");
}

window.addEventListener("beforeunload", (e) => { if (dirty || saving) { save(); e.preventDefault(); } });
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
</script>
</body>
</html>
